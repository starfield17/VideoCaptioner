name: captioner-core

channels:
  - conda-forge

dependencies:
  - python=3.13
  - pip
  - ffmpeg
  - pip:
      - pydantic>=2
      - platformdirs>=4
      - huggingface-hub>=0.34
      - tomli-w>=1
      - typer
      - rich
      - openai
      - httpx
      - ruff
      - pyright
      - pytest
      - setuptools>=75
      - -e ..
